name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Kein "version:"-Eingabewert: package.json fuehrt bereits ein
      # packageManager-Feld, und pnpm/action-setup bricht ab, wenn die Version
      # an zwei Stellen steht ("Multiple versions of pnpm specified").
      # package.json ist die eine Quelle der Wahrheit.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
