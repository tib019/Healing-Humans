services:
  - type: web
    name: healing-humans-dashboard
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install -g pnpm@10.4.1 && pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_APP_ID
        sync: false
      - key: VITE_APP_TITLE
        value: Healing Humans – Patient Dashboard
      - key: VITE_APP_LOGO
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
      - key: VITE_FRONTEND_FORGE_API_KEY
        sync: false
      - key: VITE_FRONTEND_FORGE_API_URL
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: ZAPIER_API_KEY
        sync: false
